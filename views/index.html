<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- favicon -->
    <link rel="icon" href="/public/images/favicon.png">
    <!-- css -->
    <link rel="Stylesheet" href="/public/styles/styles.css">
    <!-- js -->
    <script src="/public/scripts/script.js" defer></script>

    <title>Vacation</title>
</head>
<body>
    <div id="formdiv" class="form-group">
        <form id="form" action="/thanks" method="get">
                <div id="image" class="form-group">
                    <img src="/public/images/back.png" alt="sunset">
                        <div id="img-center">Book Your Dream Vacation</div>
                </div>
            <div class="form-group" id="dest">
                <fieldset>
                    <label for="destination">Destination</label>
                        <span class="err" id="err-destination">please choose a destination</span>
                            <select id="destination" name="destination">
                                <option value="none">  Choose a Destination</option>
                                <option value="bali">Bali, Indonesia</option>
                                <option value="paris">Paris, France</option>
                                <option value="tokyo">Tokyo, Japan</option>
                                <option value="oslo">Oslo, Norway</option>
                                <option value="newyork">New York City, USA</option>
                            </select>
                </fieldset>
            </div>

            <div class="form-group" id="depart">
                <fieldset>
                    <label for="date">Departure Date</label>
                        <span class="err" id="err-date">please choose a departure date</span>
                            <input type="date" id="date" name="date">
                </fieldset>
            </div>

            <div class="form-group" id="trav">
                <fieldset>
                    <label for="number">Number of Travelers</label>
                        <span class="err" id="err-number">please input a number greater than 0</span>
                            <input type="number" id="number" name="number">
                </fieldset>
            </div>

            <button type="submit" id="submit-button">Find My Vacation</button>
        </form>
    </div>
    
</body>
<footer>
    <a href="https://github.com/uglybrecke/vacation">Github</a>
</footer>
</html>
